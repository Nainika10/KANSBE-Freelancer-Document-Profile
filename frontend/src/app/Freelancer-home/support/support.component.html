<!-- ═════════════════════════════════════════════════════════════════
     KANSBE FREELANCER SUPPORT PAGE
     Theme: Pure Deep Black (#060606) · Liquid Transparent Glass · Kansbe Red (#FF0100)
     Behavior: Fixed Viewport (Zero Page Scrolling, Static Layout)
     Typography: 'Poppins' (Headings, Form Controls, Channels)
     ═════════════════════════════════════════════════════════════════ -->

<div class="support-page-wrapper" *ngIf="data">

  <!-- Photographic Cyberpunk Red Light Mesh Background Bleeding on Right Side -->
  <div class="support-bg-canvas"></div>

  <!-- Main Viewport Container -->
  <main class="support-main-container">

    <!-- Hero Title Header Section -->
    <header class="support-hero-header">
      <h1 class="support-hero-title">
        Contact Our <span class="gradient-red-text">Support Team</span>
      </h1>
    </header>

    <!-- Main 2-Column Liquid Transparent Glass Grid -->
    <div class="support-dashboard-grid">

      <!-- ─── LEFT COLUMN: CONTACT SUPPORT FORM CARD ─── -->
      <div class="support-form-col">
        <div class="support-form-glass-card">

          <div class="form-card-header">
            <div class="form-header-icon-wrap">
              <i class="bi bi-chat-left-dots-fill"></i>
            </div>
            <div class="form-header-text">
              <h3 class="form-card-title">Send Us a Message</h3>
            </div>
          </div>

          <form (ngSubmit)="onSubmit()" class="support-active-form">

            <!-- 2-Column Row: Name & Email -->
            <div class="form-row-2col">
              <div class="form-field-group">
                <label class="form-field-label">
                  <span>Full Name</span>
                  <span class="required-star">*</span>
                </label>
                <div class="input-glass-wrapper">
                  <i class="bi bi-person-fill input-icon-prefix"></i>
                  <input type="text" class="glass-form-input" name="name" [(ngModel)]="supportData.name"
                    placeholder="Enter your full name" required>
                </div>
              </div>

              <div class="form-field-group">
                <label class="form-field-label">
                  <span>Email Address</span>
                  <span class="required-star">*</span>
                </label>
                <div class="input-glass-wrapper">
                  <i class="bi bi-envelope-fill input-icon-prefix"></i>
                  <input type="email" class="glass-form-input" name="email" [(ngModel)]="supportData.email"
                    placeholder="email@example.com" required>
                </div>
              </div>
            </div>

            <!-- Subject Row -->
            <div class="form-field-group">
              <label class="form-field-label">
                <span>Subject / Inquiry Type</span>
                <span class="required-star">*</span>
              </label>
              <div class="input-glass-wrapper">
                <i class="bi bi-tag-fill input-icon-prefix"></i>
                <input type="text" class="glass-form-input" name="subject" [(ngModel)]="supportData.subject"
                  placeholder="What can we help you with? (e.g. Payment, Technical, Account)" required>
              </div>
            </div>

            <!-- Message Textarea -->
            <div class="form-field-group">
              <label class="form-field-label">
                <span>Message</span>
                <span class="required-star">*</span>
              </label>
              <div class="input-glass-wrapper textarea-wrapper">
                <textarea class="glass-form-textarea custom-scrollbar" name="message" [(ngModel)]="supportData.message"
                  placeholder="Describe your issue or inquiry in detail so we can assist you quickly..."
                  required></textarea>
              </div>
            </div>

            <!-- Submit Button Row -->
            <div class="form-actions-row">
              <button type="submit" class="btn-send-support" [disabled]="loading">
                <ng-container *ngIf="!loading">
                  <span>Send Message</span>
                  <i class="bi bi-arrow-right-short btn-arrow-icon"></i>
                </ng-container>
                <ng-container *ngIf="loading">
                  <span>Submitting Request...</span>
                  <span class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></span>
                </ng-container>
              </button>
            </div>

          </form>

        </div>
      </div>

      <!-- ─── RIGHT COLUMN: DIRECT CHANNELS ─── -->
      <div class="support-sidebar-col">

        <!-- Direct Channels Glass Card -->
        <div class="sidebar-channels-glass-card">
          <div class="channels-header">
            <h3 class="channels-title">Direct Channels</h3>
          </div>

          <div class="channels-stack">

            <!-- Email Support -->
            <a href="mailto:support@kansbe.com" class="channel-glass-row">
              <div class="channel-icon-orb-red">
                <i class="bi bi-envelope-fill"></i>
              </div>
              <div class="channel-info-group">
                <span class="channel-type-label">Email Support</span>
                <span class="channel-contact-val">support@kansbe.com</span>
              </div>
              <i class="bi bi-box-arrow-up-right channel-external-icon"></i>
            </a>

            <!-- Phone Support -->
            <a href="tel:+916305979395" class="channel-glass-row">
              <div class="channel-icon-orb-red">
                <i class="bi bi-telephone-fill"></i>
              </div>
              <div class="channel-info-group">
                <span class="channel-type-label">Priority Line</span>
                <span class="channel-contact-val">+91 6300879704</span>
              </div>
              <i class="bi bi-box-arrow-up-right channel-external-icon"></i>
            </a>

            <!-- 24/7 Availability -->
            <div class="channel-glass-row no-hover">
              <div class="channel-icon-orb-red">
                <i class="bi bi-clock-fill"></i>
              </div>
              <div class="channel-info-group">
                <span class="channel-type-label">Operational Hours</span>
                <span class="channel-contact-val">24/7 Continuous Support</span>
              </div>
            </div>

          </div>
        </div>

      </div>

    </div>

  </main>

</div>

<app-error-message *ngIf="!data"></app-error-message>
